<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <!-- Content-Security-Policy — placée en tout premier dans le head (une CSP en
         <meta> ne s'applique qu'aux ressources chargées après elle). Détail des
         directives : voir le commentaire équivalent dans audit_logs.html. -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src https://fonts.gstatic.com;
        img-src 'self';
        connect-src 'self' https://bhjycotcmkqiumukkkih.supabase.co;
        object-src 'none';
        base-uri 'self';
        form-action 'self';
    ">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cap Huma</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">

    <!-- Tailwind CSS CDN -->
    <script src="shared/vendor/tailwind-browser-4.js"></script>

    <!-- Supabase CDN (Standard Non-Module) -->
    <script src="shared/vendor/supabase-js-2.110.6.js"></script>

    <!-- Configuration Supabase partagée (source unique — remplace le pont localStorage) -->
    <script src="shared/caphuma-config.js"></script>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Charte graphique ALIMA / Cap Huma (identique à missions.html) -->
    <style type="text/tailwindcss">
        @theme {
            --font-sans: 'Inter', sans-serif;
            --color-primary: #1d4ed8;
            --color-primary-dark: #1e3a8a;
            --color-primary-light: #eff6ff;
            --color-accent: #ea580c;
            --color-accent-dark: #c2410c;
            --color-accent-light: #fff7ed;
        }
    </style>
</head>
<body class="h-full bg-slate-50 font-sans flex items-center justify-center p-4" id="appBody">

    <div class="w-full max-w-sm flex flex-col items-center gap-4">
        <div class="w-16 h-16 shadow-md cap-logo-badge">
            <style>
                .cap-logo-badge .cap-logo-needle { transform-box: fill-box; transform-origin: center; animation: cap-logo-idle 4s ease-in-out infinite; }
                @keyframes cap-logo-idle { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
            </style>
            <svg viewBox="0 0 160 160" class="w-full h-full" role="img" aria-label="Cap Huma">
                <defs>
                    <linearGradient id="capLogoGradIndex" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#1d4ed8"/>
                        <stop offset="100%" stop-color="#ea580c"/>
                    </linearGradient>
                </defs>
                <circle cx="80" cy="80" r="80" fill="url(#capLogoGradIndex)"/>
                <circle cx="80" cy="80" r="58" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>
                <g stroke="rgba(255,255,255,0.55)" stroke-width="2" stroke-linecap="round">
                    <line x1="80" y1="16" x2="80" y2="26"/>
                    <line x1="80" y1="134" x2="80" y2="144"/>
                    <line x1="16" y1="80" x2="26" y2="80"/>
                    <line x1="134" y1="80" x2="144" y2="80"/>
                </g>
                <g class="cap-logo-needle">
                    <polygon points="80,28 90,80 80,80" fill="#ffffff"/>
                    <polygon points="80,28 70,80 80,80" fill="rgba(255,255,255,0.55)"/>
                    <polygon points="80,132 90,80 80,80" fill="rgba(255,255,255,0.3)"/>
                    <polygon points="80,132 70,80 80,80" fill="rgba(255,255,255,0.15)"/>
                    <circle cx="80" cy="80" r="5" fill="#ffffff"/>
                </g>
            </svg>
        </div>
        <h1 class="text-2xl font-extrabold text-slate-800 tracking-tight">Cap Huma</h1>

        <div class="flex flex-col items-center gap-3 py-4">
            <svg class="animate-spin h-8 w-8 text-primary" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
            </svg>
            <p class="text-xs text-slate-500 font-semibold">Chargement...</p>
        </div>

        <p id="bootError" class="hidden text-xs font-semibold text-red-600 bg-red-50 border border-red-100 rounded-lg p-3 text-center"></p>
    </div>

    <script src="pages/index.js"></script>
</body>
</html>

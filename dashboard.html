<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <!-- Content-Security-Policy (B3, Master Context §7) — généralisée depuis la
         page pilote audit_logs.html, testée sans erreur le 25/08/2026. Placée en
         tout premier dans le head (une CSP en <meta> ne s'applique qu'aux ressources
         chargées après elle). Détail des directives et rationale : voir le
         commentaire équivalent dans audit_logs.html. -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src https://fonts.gstatic.com;
        img-src 'self';
        connect-src 'self' https://bhjycotcmkqiumukkkih.supabase.co;
        object-src 'none';
        base-uri 'self';
        form-action 'self';
    ">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau de bord - Cap Huma</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">

    <!-- Tailwind CSS CDN -->
    <script src="shared/vendor/tailwind-browser-4.js"></script>

    <!-- Supabase CDN (Standard Non-Module) -->
    <script src="shared/vendor/supabase-js-2.110.6.js"></script>
    <script src="shared/caphuma-config.js"></script>
    <script src="shared/caphuma-utils.js"></script>
    <!-- Intercepteur global d'erreurs (B16-O1, priorité P2) -->
    <script src="shared/caphuma-error-monitor.js"></script>
    <script src="shared/caphuma-auth.js"></script>
    <!-- Déconnexion automatique après inactivité (B14-I2, priorité P6) -->
    <script src="shared/caphuma-idle-timeout.js"></script>
    <script src="shared/caphuma-layout.js"></script>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Charte graphique ALIMA / Cap Huma (identique à missions.html) -->
    <style type="text/tailwindcss">
        @theme {
            --font-sans: 'Inter', sans-serif;
            --color-primary: #1d4ed8;
            --color-primary-dark: #1e3a8a;
            --color-primary-light: #eff6ff;
            --color-accent: #ea580c;
            --color-accent-dark: #c2410c;
            --color-accent-light: #fff7ed;
        }
    </style>
</head>
<body class="h-full bg-slate-50 font-sans flex flex-col overflow-hidden" id="appBody" style="display: none;">

    <!-- ────────────────────────────────────────────────────────────────────────
         EN-TÊTE SUPÉRIEUR — injecté par shared/caphuma-layout.js (B4, Master
         Context §7, 2ᵉ étape). Voir renderDashboardLayout() dans pages/dashboard.js.
         ──────────────────────────────────────────────────────────────────────── -->
    <div id="layoutHeaderMount"></div>

    <!-- ────────────────────────────────────────────────────────────────────────
         ZONE PRINCIPALE : CARTES DE POOLS
         ──────────────────────────────────────────────────────────────────────── -->
    <main class="max-w-7xl w-full mx-auto px-6 py-8 flex-1 overflow-auto">

        <div class="mb-6 flex items-end justify-between flex-wrap gap-3">
            <div>
                <h2 class="text-xl font-extrabold text-slate-800">Sélectionnez un pool</h2>
                <p class="text-sm text-slate-400 mt-1">Accédez à la gestion terrain ou aux statistiques de chaque vivier métier.</p>
            </div>
            <div id="archivedToggleContainer" class="hidden">
                <button id="archivedToggleBtn" type="button" class="border border-slate-200 hover:bg-slate-50 text-slate-500 px-3 py-2 rounded-lg text-xs font-bold transition-all"></button>
            </div>
        </div>

        <div id="poolsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
            <!-- Squelettes de chargement -->
            <div class="animate-pulse bg-white border border-slate-200 rounded-3xl h-48"></div>
            <div class="animate-pulse bg-white border border-slate-200 rounded-3xl h-48"></div>
            <div class="animate-pulse bg-white border border-slate-200 rounded-3xl h-48"></div>
        </div>

        <p id="poolsError" class="hidden mt-6 text-sm font-semibold text-red-600 bg-red-50 border border-red-100 rounded-lg p-4"></p>

    </main>

    <script src="pages/dashboard.js"></script>
</body>
</html>
